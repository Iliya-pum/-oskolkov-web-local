<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oskolkov Web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.3" r="0.6">
      <stop stop-color="#DC2626" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="140" y1="300" x2="760" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF4444"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#94A3B8" stroke-opacity="0.06">
    <path d="M0 90h1200M0 210h1200M0 330h1200M0 450h1200M0 570h1200"/>
    <path d="M120 0v630M300 0v630M480 0v630M660 0v630M840 0v630M1020 0v630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(120,120)">
    <rect x="1.5" y="1.5" width="70" height="70" rx="20" fill="#111C2E" stroke="#DC2626" stroke-width="2"/>
    <path d="M27 25 17 37l10 12" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 25l10 12-10 12" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 21 32 53" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
    <text x="90" y="52" font-family="Archivo, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Oskolkov Web <tspan fill="#EF4444">Local</tspan></text>
  </g>

  <!-- headline -->
  <text x="120" y="320" font-family="Archivo, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" fill="#F8FAFC">Webs que hacen crecer</text>
  <text x="120" y="405" font-family="Archivo, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" fill="url(#accent)">tu pequeño negocio</text>

  <!-- sub -->
  <text x="122" y="470" font-family="'Space Grotesk', Arial, sans-serif" font-size="30" fill="#94A3B8">Diseño y desarrollo web · Rápido · Multilingüe · Desde 300 €</text>

  <!-- pill -->
  <g transform="translate(120,520)">
    <rect width="330" height="60" rx="30" fill="#DC2626"/>
    <text x="165" y="39" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">WhatsApp +34 628 806 573</text>
