<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="{{ tema.esquema }}">
<title>{{ titulo }}</title>
<meta name="description" content="{{ descripcion }}">
{% if sitio.noindex %}
<meta name="robots" content="noindex, nofollow">
{% endif %}
<link rel="canonical" href="{{ url_pagina }}">
{% for a in alternos %}
<link rel="alternate" hreflang="{{ a.lang }}" href="{{ a.url }}">
{% endfor %}
<link rel="alternate" hreflang="x-default" href="{{ url_x_default }}">
<meta name="theme-color" content="{{ tema.colores.fondo }}">
<link rel="icon" href="{{ raiz }}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ raiz }}favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="{{ raiz }}apple-touch-icon.png">
<link rel="manifest" href="{{ raiz }}site.webmanifest">
{% for f in fuentes_precarga %}
<link rel="preload" href="{{ raiz }}fonts/{{ f }}" as="font" type="font/woff2" crossorigin>
{% endfor %}
{% if pagina == "index" %}
{{ precarga_img }}
{% endif %}
<link rel="stylesheet" href="{{ raiz }}style.css?v={{ asset_v }}">
<script>(function(d){var c=d.classList;c.add("js");if("IntersectionObserver"in window&&!matchMedia("(prefers-reduced-motion: reduce)").matches){c.add("rv");addEventListener("load",function(){setTimeout(function(){if(!c.contains("rv-ok"))c.remove("rv")},1500)})}})(document.documentElement)</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ negocio.nombre }}">
<meta property="og:locale" content="{{ og_locale }}">
{% for l in og_locales_alt %}
<meta property="og:locale:alternate" content="{{ l }}">
{% endfor %}
<meta property="og:title" content="{{ titulo }}">
<meta property="og:description" content="{{ descripcion }}">
<meta property="og:url" content="{{ url_pagina }}">
<meta property="og:image" content="{{ sitio.url }}og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ textos.seo.og_alt }}">
<meta name="twitter:card" content="summary_large_image">
